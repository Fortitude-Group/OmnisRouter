# Pinned pricing snapshot for OmnisRouter cost math.
#
# One entry per provider/model_id in config/models.yaml. Prices are USD per
# 1,000 tokens. This snapshot is dated and immutable — cost figures in routing
# receipts cite snapshot_date so every number is reproducible (Constitution
# Principle XII: Explain Every Number) and aligns with OmnisBench's cost math,
# which reads pricing snapshots the same way. Adding a new snapshot (e.g. after
# a provider price change) means adding a new dated file, never editing this one.
#
# cache_write_per_1k / cache_read_per_1k are optional — omit for models/providers
# that don't support prompt caching (see models.yaml `cache` capability flag).

snapshot_date: "2026-08-15"

pricing:
  - provider: anthropic
    model_id: claude-haiku-4-5
    input_per_1k: 0.001
    output_per_1k: 0.005
    cache_write_per_1k: 0.00125
    cache_read_per_1k: 0.0001

  - provider: anthropic
    model_id: claude-opus-5
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  - provider: openai
