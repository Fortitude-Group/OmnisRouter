name: CI

# Build and test on every push and PR. Release configuration matches the release gate
# (Directory.Build.props sets TreatWarningsAsErrors, so a warning fails the build).
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OmnisRouter.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build OmnisRouter.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test OmnisRouter.slnx -c Release --no-build --verbosity normal

  # The tray is net10.0-windows (WinForms), so it can't build on the ubuntu solution build above.
  # This leg keeps it in parity: every push compiles it on Windows, warnings-as-errors.
  tray-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the Windows tray (Release, warnings are errors)
        run: dotnet build src/OmnisRouter.Tray/OmnisRouter.Tray.csproj -c Release
