name: Release

# Fires when a version tag is pushed. Tagging is a deliberate human action taken AFTER
# scripts/release-gate.ps1 passes (build + tests + the OmnisBench benchmark, FR-018) — this
# workflow re-runs build+test as a guard, then publishes the artefacts for that tag:
#   - self-contained single-file binaries (linux-x64, win-x64, osx-arm64) as a GitHub Release,
#   - a container image to GHCR,
#   - the omnisrouter-cli client-config helper to npm.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build (e.g. v0.1.0); used for artefact names'
        required: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build OmnisRouter.slnx -c Release
      - run: dotnet test OmnisRouter.slnx -c Release --no-build

  binaries:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ linux-x64, win-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single file (${{ matrix.rid }})
        run: dotnet publish src/OmnisRouter.Api -c Release -p:PublishProfile=selfhost -r ${{ matrix.rid }}

      - name: Copy config/ and routing/, fetch the pinned ONNX embedder
        shell: pwsh
        run: |
          $pub = "src/OmnisRouter.Api/bin/Release/net10.0/${{ matrix.rid }}/publish"
          Copy-Item -Recurse -Force config,routing "$pub/"
          # Same pinned asset the container ships, so the downloaded binary routes with the real
          # embedder out of the box instead of falling back to the hashing embedder.
          ./scripts/fetch-embedder.ps1 -OutDir "$pub/models/bge-small-en-v1.5"

      - name: Zip (preserving the executable bit)
        run: |
          pub="src/OmnisRouter.Api/bin/Release/net10.0/${{ matrix.rid }}/publish"
          ( cd "$pub" && zip -r "$GITHUB_WORKSPACE/omnisrouter-${{ env.TAG }}-${{ matrix.rid }}.zip" . )

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: omnisrouter-${{ env.TAG }}-${{ matrix.rid }}.zip
          fail_on_unmatched_files: true

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the tray (self-contained win-x64)
        run: dotnet publish src/OmnisRouter.Tray/OmnisRouter.Tray.csproj -p:PublishProfile=tray-win-x64

      - name: Build the per-user MSI
        shell: pwsh
        run: |
          $ver = "${{ env.TAG }}".TrimStart('v')
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $pub = (Resolve-Path "src/OmnisRouter.Tray/bin/publish/win-x64").Path
          $lic = (Resolve-Path "installer/msi/License.rtf").Path
          wix build installer/msi/OmnisRouter.wxs -arch x64 -ext WixToolset.UI.wixext -d PublishDir=$pub -d Version=$ver -d LicenseRtf=$lic -o "OmnisRouter-$ver-win-x64.msi"

      - name: Validate the winget manifest
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest installer/winget/manifests
          } else {
            Write-Host "winget CLI not present on this runner; manifest is validated on submission to winget-pkgs."
          }

      - name: Attach the MSI to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: OmnisRouter-*-win-x64.msi
          fail_on_unmatched_files: true

  container:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -f deploy/Dockerfile -t "$repo:${{ env.TAG }}" -t "$repo:latest" .
          docker push "$repo:${{ env.TAG }}"
          docker push "$repo:latest"

  npm:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish omnisrouter-cli
        working-directory: installer
        run: |
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
